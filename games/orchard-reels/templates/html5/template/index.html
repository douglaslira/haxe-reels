<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>::APP_TITLE::</title>
	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="mobile-web-app-capable" content="yes">

	::if favicons::::foreach (favicons)::
	<link rel="::__current__.rel::" type="::__current__.type::" href="::__current__.href::">::end::::end::

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap" rel="stylesheet">

	::if linkedLibraries::::foreach (linkedLibraries)::
	<script type="text/javascript" src="::__current__::"></script>::end::::end::
	<script type="text/javascript" src="./::APP_FILE::.js"></script>

	<script>
		window.addEventListener("touchmove", function (event) { event.preventDefault(); }, { capture: false, passive: false });
		if (typeof window.devicePixelRatio != 'undefined' && window.devicePixelRatio > 2) {
			var meta = document.getElementById("viewport");
			meta.setAttribute('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');
		}
	</script>

	<style>
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			overflow: hidden;
			background:
				radial-gradient(ellipse 70% 50% at 50% 0%, rgba(201,164,92,0.08), transparent 55%),
				#090b0a;
			font-family: "Outfit", system-ui, sans-serif;
		}
		#wrap {
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		#openfl-content {
			box-shadow:
				0 0 0 1px rgba(201,164,92,0.28),
				0 24px 48px rgba(0,0,0,0.55);
			border-radius: 12px;
			overflow: hidden;
		}
		#openfl-content canvas { display: block; max-width: 100%; max-height: 100%; }
	</style>
</head>
<body>
	<div id="wrap">
		<div id="openfl-content"></div>
	</div>
	<script>
		lime.embed("::APP_FILE::", "openfl-content", ::WIN_WIDTH::, ::WIN_HEIGHT::, { parameters: {} });
	</script>
</body>
</html>
